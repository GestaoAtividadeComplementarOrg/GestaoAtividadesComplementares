name: CI

on:
  push:
    branches:
      - main
      - ia
  pull_request:
    branches:
      - main
      - ia

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  # ============================================================
  # BACKEND
  # ============================================================

  backend:
    name: Backend - Build, Testes e Cobertura
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build, testes e JaCoCo
        run: ./mvnw clean verify -Dspring.profiles.active=test

      - name: Verificar relatório JaCoCo
        run: |
          if [ ! -f target/site/jacoco/jacoco.xml ]; then
            echo "ERRO: relatório JaCoCo não encontrado."
            exit 1
          fi
          echo "Relatório JaCoCo encontrado:"
          ls -lh target/site/jacoco/jacoco.xml

      - name: Publicar relatório JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14

  # ============================================================
  # FRONTEND (Build e Testes)
  # ============================================================

  frontend:
    name: Frontend - Build, Testes e Cobertura
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Front

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Front/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Testes e cobertura
        run: npm run test:coverage

      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: Front/coverage/
          if-no-files-found: warn
          retention-days: 14

      - name: Build
        run: npm run build

  # ============================================================
  # SONARCLOUD (Apenas Backend)
  # ============================================================

  sonarcloud:
    name: SonarCloud - Backend Scan
    runs-on: ubuntu-latest
    needs: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Cache SonarCloud
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Baixar cobertura do backend
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: backend/target/site/jacoco/

      - name: Compilar classes Java
        working-directory: backend
        run: ./mvnw compile test-compile

      - name: Executar SonarCloud Scan
        working-directory: backend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./mvnw org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.token="${SONAR_TOKEN}" \
            -Dsonar.organization="sgac-gestaoatividadecomplementarorg" \
            -Dsonar.projectKey="sgac-gestaoatividadecomplementarorg_gestaoatividadecomplementarorg" \
            -Dsonar.host.url="https://sonarcloud.io" \
            -Dsonar.java.binaries="target/classes" \
            -Dsonar.java.test.binaries="target/test-classes" \
            -Dsonar.coverage.jacoco.xmlReportPaths="target/site/jacoco/jacoco.xml"