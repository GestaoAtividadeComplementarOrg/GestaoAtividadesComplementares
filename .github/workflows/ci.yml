name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  backend:
    name: Backend - Build e Testes
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: |
            ${{ runner.os }}-sonar

      - name: Build e testes (Maven com JaCoCo)
        run: ./mvnw clean test -Dspring.profiles.active=test jacoco:report

      - name: Publicar relatório de cobertura JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14

      - name: SonarCloud Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          ./mvnw sonar:sonar
          -Dsonar.token="${{ secrets.SONAR_TOKEN }}"
          -Dsonar.organization=gestaoatividadecomplementarorg
          -Dsonar.projectKey=GestaoAtividadeComplementarOrg_GestaoAtividadesComplementares
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.coverage.jacoco.xmlReportPaths=${{ github.workspace }}/backend/target/site/jacoco/jacoco.xml

  frontend:
    name: Frontend - Build e Testes
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Front

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Front/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Testes e cobertura
        run: npm run test:coverage

      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: Front/coverage/
          if-no-files-found: warn
          retention-days: 14

      - name: Build
        run: npm run build
