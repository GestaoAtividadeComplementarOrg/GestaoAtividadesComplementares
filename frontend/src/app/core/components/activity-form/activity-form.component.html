<form
  [formGroup]="form"
  (ngSubmit)="submitEmit.emit()"
  aria-label="Formulário de Cadastro de Atividade"
  class="bg-surface-container-lowest rounded-xl shadow-[0_4px_20px_rgba(0,0,0,0.05)] border border-surface-variant p-6 md:p-8 space-y-8"
>
  <div class="space-y-6">
    <h2 class="font-title-md text-title-md text-on-surface border-b border-surface-variant pb-2">
      Informações Gerais
    </h2>
    <div class="space-y-2">
      <label class="block font-label-sm text-label-sm text-on-surface" for="titulo">
        Título da Atividade <span aria-hidden="true" class="text-error">*</span>
      </label>
      <input
        id="titulo"
        type="text"
        formControlName="titulo"
        placeholder="Ex: Minicurso de Python para Análise de Dados"
        class="w-full bg-surface-container-lowest border border-outline-variant text-on-surface font-body-md text-body-md rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-primary-container/50 focus:border-primary-container transition-all"
      />
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div class="space-y-2">
        <label class="block font-label-sm text-label-sm text-on-surface" for="instituicao"
          >Instituição Responsável</label
        >
        <input
          id="instituicao"
          type="text"
          formControlName="instituicao"
          placeholder="Ex: UFAPE, Sebrae, etc."
          class="w-full bg-surface-container-lowest border border-outline-variant text-on-surface font-body-md text-body-md rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-primary-container/50 focus:border-primary-container transition-all"
        />
      </div>
      <div class="space-y-2">
        <label class="block font-label-sm text-label-sm text-on-surface" for="data">
          Data de Realização <span aria-hidden="true" class="text-error">*</span>
        </label>
        <input
          id="data"
          type="date"
          formControlName="data"
          class="w-full bg-surface-container-lowest border border-outline-variant text-on-surface font-body-md text-body-md rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-primary-container/50 focus:border-primary-container transition-all"
        />
      </div>
    </div>
  </div>
  <div class="space-y-6">
    <h2 class="font-title-md text-title-md text-on-surface border-b border-surface-variant pb-2">
      Classificação
    </h2>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div class="space-y-3">
        <span class="block font-label-sm text-label-sm text-on-surface mb-1">
          Natureza da Atividade <span aria-hidden="true" class="text-error">*</span>
        </span>
        <div class="flex gap-4">
          <label class="flex-1 cursor-pointer">
            <input type="radio" formControlName="natureza" value="ACC" class="peer sr-only" />
            <div
              class="border border-outline-variant rounded-lg p-4 text-center peer-checked:bg-primary-container/10 peer-checked:border-primary-container peer-checked:text-primary-container hover:bg-surface-container-low transition-all"
            >
              <span class="font-body-md text-body-md font-medium">ACC</span>
              <span class="block font-label-sm text-label-sm text-on-surface-variant mt-1"
                >Curricular</span
              >
            </div>
          </label>
          <label class="flex-1 cursor-pointer">
            <input type="radio" formControlName="natureza" value="ACEX" class="peer sr-only" />
            <div
              class="border border-outline-variant rounded-lg p-4 text-center peer-checked:bg-primary-container/10 peer-checked:border-primary-container peer-checked:text-primary-container hover:bg-surface-container-low transition-all"
            >
              <span class="font-body-md text-body-md font-medium">ACEX</span>
              <span class="block font-label-sm text-label-sm text-on-surface-variant mt-1"
                >Extensão</span
              >
            </div>
          </label>
        </div>
      </div>
      <div class="space-y-6">
        <div class="space-y-2">
          <label class="block font-label-sm text-label-sm text-on-surface" for="categoria">
            Categoria <span aria-hidden="true" class="text-error">*</span>
          </label>
          <select
            id="categoria"
            formControlName="categoria"
            class="w-full bg-surface-container-lowest border border-outline-variant text-on-surface font-body-md text-body-md rounded-lg pl-4 pr-10 py-3 appearance-none focus:outline-none focus:ring-2 focus:ring-primary-container/50 focus:border-primary-container transition-all"
          >
            <option value="" disabled selected>Selecione uma categoria...</option>
            <option value="PESQUISA">Pesquisa</option>
            <option value="EXTENSAO">Extensão</option>
            <option value="ENSINO">Ensino</option>
            <option value="EVENTOS">Eventos</option>
          </select>
        </div>
        <div class="space-y-2">
          <label class="block font-label-sm text-label-sm text-on-surface" for="carga-horaria">
            Carga Horária (horas) <span aria-hidden="true" class="text-error">*</span>
          </label>
          <input
            id="carga-horaria"
            type="number"
            min="1"
            formControlName="cargaHoraria"
            placeholder="0"
            class="w-full bg-surface-container-lowest border border-outline-variant text-on-surface font-body-md text-body-md rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-primary-container/50 focus:border-primary-container transition-all"
          />
        </div>
      </div>
    </div>
  </div>
  <div class="pt-6 border-t border-surface-variant flex flex-col sm:flex-row justify-end gap-4">
    <button
      type="button"
      [routerLink]="cancelRoute"
      class="px-6 py-3 border border-outline rounded-lg font-label-sm text-label-sm text-on-surface font-medium hover:bg-surface-container-low transition-colors"
    >
      Cancelar
    </button>
    <button
      id="submit-btn"
      type="submit"
      class="px-8 py-3 bg-primary-container text-on-primary-container rounded-lg font-label-sm text-label-sm font-medium hover:bg-primary transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
    >
      {{ submitLabel }}
    </button>
  </div>
</form>
