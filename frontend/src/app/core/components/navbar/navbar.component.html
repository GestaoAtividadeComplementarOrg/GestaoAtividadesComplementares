<header class="bg-white border-b border-[#c0c9c3] shadow-sm sticky top-0 z-50">
  <div class="flex justify-between items-center px-4 md:px-8 w-full max-w-[1280px] mx-auto h-16">
    <div class="flex items-center gap-6">
      <a routerLink="/" class="text-lg md:text-xl font-bold text-[#003629] tracking-tight">
        SGAC - UFAPE
      </a>

      @if (estaAutenticado()) {
        <nav class="hidden md:flex items-center gap-4 text-sm font-medium">
          <!-- Links de Estudante -->
          @if (isEstudante) {
            <a
              routerLink="/dashboard"
              routerLinkActive="text-[#003629] font-bold border-b-2 border-[#003629]"
              class="text-[#404945] hover:text-[#003629] py-1 transition-colors"
            >
              Dashboard
            </a>
            <a
              routerLink="/atividades"
              routerLinkActive="text-[#003629] font-bold border-b-2 border-[#003629]"
              class="text-[#404945] hover:text-[#003629] py-1 transition-colors"
            >
              Atividades
            </a>
            <a
              routerLink="/progresso"
              routerLinkActive="text-[#003629] font-bold border-b-2 border-[#003629]"
              class="text-[#404945] hover:text-[#003629] py-1 transition-colors"
            >
              Progresso
            </a>
            <a
              routerLink="/solicitacoes"
              routerLinkActive="text-[#003629] font-bold border-b-2 border-[#003629]"
              class="text-[#404945] hover:text-[#003629] py-1 transition-colors"
            >
              Minhas Solicitações
            </a>
            <a
              routerLink="/relatorio"
              routerLinkActive="text-[#003629] font-bold border-b-2 border-[#003629]"
              class="text-[#404945] hover:text-[#003629] py-1 transition-colors"
            >
              Relatório
            </a>
          }

          <!-- Links de Avaliador / Docente -->
          @if (isAvaliador) {
            <a
              routerLink="/avaliacao"
              routerLinkActive="text-[#003629] font-bold border-b-2 border-[#003629]"
              [routerLinkActiveOptions]="{ exact: true }"
              class="text-[#404945] hover:text-[#003629] py-1 transition-colors"
            >
              Fila de Avaliação
            </a>
            <a
              routerLink="/avaliacao/solicitacoes"
              routerLinkActive="text-[#003629] font-bold border-b-2 border-[#003629]"
              class="text-[#404945] hover:text-[#003629] py-1 transition-colors"
            >
              Histórico
            </a>
            <a
              routerLink="/regulamentos/gestao"
              routerLinkActive="text-[#003629] font-bold border-b-2 border-[#003629]"
              class="text-[#404945] hover:text-[#003629] py-1 transition-colors"
            >
              Regulamentos
            </a>
          }

          <!-- Links exclusivos de Administrador -->
          @if (isAdmin) {
            <a
              routerLink="/admin/usuarios"
              routerLinkActive="text-[#003629] font-bold border-b-2 border-[#003629]"
              class="text-[#404945] hover:text-[#003629] py-1 transition-colors"
            >
              Usuários
            </a>
            <a
              routerLink="/admin/cursos"
              routerLinkActive="text-[#003629] font-bold border-b-2 border-[#003629]"
              class="text-[#404945] hover:text-[#003629] py-1 transition-colors"
            >
              Cursos
            </a>
          }
        </nav>
      }
    </div>

    <!-- Ações e Perfil à Direita -->
    <div class="flex items-center gap-3">
      @if (estaAutenticado()) {
        <app-contador-notificacoes />
        <button
          type="button"
          (click)="themeService.toggle()"
          class="p-2 text-[#191c1d] hover:text-[#003629] transition-colors"
          aria-label="Alternar tema"
          title="Alternar tema"
        >
          <span class="material-symbols-outlined">brightness_6</span>
        </button>
        <span
          data-testid="badge-perfil"
          class="px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-[#e6efe9] text-[#003629] border border-[#c0c9c3]"
        >
          {{ perfil() }}
        </span>
        <a routerLink="/logout" class="text-sm font-medium text-[#ba1a1a] hover:underline">
          Sair
        </a>
      } @else {
        <a routerLink="/login" class="text-sm font-medium text-[#003629] hover:underline">
          Entrar
        </a>
      }
    </div>
  </div>
</header>
