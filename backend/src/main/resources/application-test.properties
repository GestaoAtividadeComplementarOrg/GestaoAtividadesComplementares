spring.application.name=GestaoAtividadesComplementares-Test

# banco de dados em memoria para testes
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# token secret para testes
api.security.token.secret=test-secret-key-para-execucao-de-testes-unitarios-e-integrados-123456
