spring.application.name=backend
spring.profiles.active=dev

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET:7hlh3JJwQOSoWiU8L5XwEDxE2PfkafFBgyr7lQaEb78=}
jwt.expiration-ms=3600000

# Origens exatas permitidas para CORS (S5122 - sem wildcards com credenciais)
app.cors.allowed-origins=http://localhost:4200

# Fonte única das horas exigidas de ACC/ACEX (issue #65) - ver ProgressoProperties
sgac.progresso.acc.horas-exigidas=90
sgac.progresso.acex.horas-exigidas=320

# Configuração de Upload de Arquivos (Task #54)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# APIS DE IA
groq.api.key=${GROQ_API_KEY:}
huggingface.api.key=${HUGGINGFACE_API_KEY:}